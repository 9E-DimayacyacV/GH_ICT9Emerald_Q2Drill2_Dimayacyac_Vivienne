<!DOCTYPE html>

<head>

    <link rel="stylesheet" type="text/css" href="style.css">

</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="/ob-logo.png" alt="OBMC Logo">
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mynavbar">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                        <li class="nav-item"><a class="nav-link" href="enroll.html">Enroll</a></li>
                        <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                    </ul>

                    <form class="d-flex">
                        <input class="form-control me-2" type="text" placeholder="Search">
                        <button class="btn btn-info text-white m-1" type="button">Portal</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>

    <div class="box-main">
        <h1><strong>ENROLLMENT FORM</strong></h1>
        <br>
        <form>

            <!-- FULL NAME -->
            <label for="full-name"><strong>Full name:</strong></label>
            <input type="text" name="full-name" placeholder="Enter your full name">

            <br>
            <br>

            <!-- EMAIL -->
            <label for="email"><strong>Official Email:</strong></label>
            <input type="email" name="full-name" placeholder="Enter a valid email">

            <br>
            <br>

            <!-- GRADE LEVEL -->
            <h4>Grade Level:</h4>
            <select>
                <option value="1">CASA</option>
                <option value="2">Primary</option>
                <option value="3">Intermediate</option>
                <option value="4">Junior High School</option>
                <option value="5">Senior High School</option>
            </select>

            <br>
            <br>

            <!-- GENDER -->
            <h4>Gender:</h4>
            <input type="radio" name="gender">
            <label for="gender">Male</label>

            <input type="radio" name="gender">
            <label for="gender">Female</label>

            <br>
            <br>

            <div class="submit">
                <button class="btn btn-warning text-white m-1" type="button">Portal</button>
            </div>
        </form>
    </div>

    <div class="container">
        <footer>© 2026 | Vivienne Dimayacyac</footer>
    </div>
